name: Курсовой проект (пояснительная записка по СТП)
sections:
  - id: 00_introduction
    rules: introduction
    title: ВВЕДЕНИЕ
    level: 1
    numbered: false
    words: 350
    guide: >
      Актуальность темы, связь с дисциплиной, почему выбрана предметная область и средства реализации,
      цель работы и перечень задач, краткая структура записки.

  - id: 01_analysis
    title: АНАЛИЗ ПРЕДМЕТНОЙ ОБЛАСТИ
    level: 1
    words: 0
  - id: 01_01_domain
    rules: analysis
    title: Описание предметной области
    level: 2
    words: 600
    guide: >
      Сущности предметной области, их роли и связи, бизнес-процессы, проблемы, которые решает система.
  - id: 01_02_analogues
    rules: analysis
    title: Анализ существующих решений
    level: 2
    words: 600
    guide: >
      Два-три реальных аналога, их сильные и слабые стороны, итоговое сравнение и вывод о том,
      что следует взять за основу. Не выдумывай названия аналогов: используй только указанные пользователем.
  - id: 01_03_specification
    rules: analysis
    title: Постановка задачи
    level: 2
    words: 450
    guide: >
      Функциональные и нефункциональные требования, пользователи и роли, ограничения, ожидаемый результат.

  - id: 02_design
    title: ПРОЕКТИРОВАНИЕ СИСТЕМЫ
    level: 1
    words: 0
  - id: 02_01_database
    rules: design
    title: Проектирование базы данных
    level: 2
    words: 700
    figures: [er, logical]
    guide: >
      Инфологическая и даталогическая модели, описание сущностей и атрибутов, связи и мощности, нормализация, индексы.
  - id: 02_02_system
    rules: design
    title: Проектирование архитектуры системы
    level: 2
    words: 600
    figures: [architecture, usecase, classes]
    guide: >
      Общая архитектура, компоненты и их взаимодействие, варианты использования, ключевые процессы.

  - id: 03_development
    title: РАЗРАБОТКА СИСТЕМЫ
    level: 1
    words: 0
  - id: 03_01_tools
    rules: development
    title: Выбор средств реализации
    level: 2
    words: 450
    guide: >
      Языки, фреймворки, СУБД, инструменты и обоснование выбора каждого на основе стека проекта.
  - id: 03_02_database
    rules: development
    title: Реализация базы данных
    level: 2
    words: 600
    figures: [physical]
    guide: >
      Физическая схема, ключевые таблицы, ограничения целостности, индексы, пересказом, без дословного DDL.
  - id: 03_03_implementation
    rules: development
    title: Программная реализация приложения
    level: 2
    words: 800
    guide: >
      Структура модулей, ключевые алгоритмы и процессы, взаимодействие слоёв, обработка ошибок и безопасность.

  - id: 04_manual
    rules: manual
    title: РУКОВОДСТВО ПОЛЬЗОВАТЕЛЯ
    level: 1
    words: 600
    figures: [screen_main, screen_work]
    guide: >
      Сценарии работы по ролям: запуск, основные действия, результат. К каждому сценарию приводится экран.

  - id: 0A_conclusion
    rules: conclusion
    title: ЗАКЛЮЧЕНИЕ
    level: 1
    numbered: false
    words: 300
    guide: >
      Что сделано, какие задачи решены, что получено, что можно развивать. Настоящее время, около одной страницы.

  - id: 0B_references
    title: СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ
    level: 1
    numbered: false
    words: 0
    kind: references
