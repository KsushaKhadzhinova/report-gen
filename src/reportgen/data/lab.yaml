name: Отчёт по лабораторной работе
sections:
  - id: 01_goal
    title: Цель работы
    level: 1
    numbered: false
    words: 80
    guide: "Одно-два предложения: чему посвящена работа и чему нужно научиться. Опирайся на формулировку задания."

  - id: 02_task
    title: Постановка задачи
    level: 1
    numbered: false
    words: 150
    guide: "Перескажи задание своими словами, перечисли подзадачи и исходные данные варианта."

  - id: 03_theory
    title: Теоретические сведения
    level: 1
    numbered: false
    words: 400
    guide: "Кратко изложи теорию, необходимую для выполнения работы: определения, формулы, алгоритмы по теме задания."

  - id: 04_progress
    title: Ход работы
    level: 1
    numbered: false
    words: 500
    figures: [step1, step2, step3]
    guide: "Пошагово опиши выполнение: что делалось, какие инструменты, какие результаты. К шагам привязываются скриншоты."

  - id: 05_conclusion
    title: Выводы
    level: 1
    numbered: false
    words: 120
    guide: "Что изучено, каков итог, как результат соотносится с целью работы."
