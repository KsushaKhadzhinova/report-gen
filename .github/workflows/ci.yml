name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Scan tracked files for secrets and personal files
        run: python scripts/check_secrets.py --all

  test:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  pdf:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: report-gen:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Capture screenshots
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" report-gen:latest shots examples/demo
      - name: Build DOCX, TeX and PDF
        run: docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" report-gen:latest build examples/demo
      - name: Show the LaTeX log tail on failure
        if: failure()
        run: |
          log=examples/demo/output/tex/note.log
          if [ -f "$log" ]; then
            body=$(tail -n 40 "$log" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=LaTeX log::$body"
          else
            echo "::error title=LaTeX log::no log file was produced"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: |
            examples/demo/output/note.docx
            examples/demo/output/note.pdf
            examples/demo/output/tex/note.tex
