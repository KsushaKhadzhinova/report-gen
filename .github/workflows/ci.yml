name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  pdf:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t report-gen:latest .
      - name: Capture screenshots
        run: docker run --rm -v "$PWD:/work" report-gen:latest shots examples/demo
      - name: Build DOCX, TeX and PDF
        run: docker run --rm -v "$PWD:/work" report-gen:latest build examples/demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: |
            examples/demo/output/note.docx
            examples/demo/output/note.pdf
            examples/demo/output/tex/note.tex
