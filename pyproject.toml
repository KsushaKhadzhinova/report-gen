[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-gen"
version = "0.1.0"
description = "Генератор пояснительных записок и отчётов по СТП БГУИР: DOCX, LaTeX и PDF из одного источника"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "keyring>=25.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
capture = ["playwright>=1.45", "pyautogui>=0.9"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
report-gen = "reportgen.interface.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reportgen = ["data/*.yaml", "data/*.tex", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
